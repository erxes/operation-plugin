name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read
  packages: write
  id-token: write

env:
  NX_DAEMON: false

jobs:
  # Run only the side that changed: api/ -> API job, ui/ -> UI job. Files at the
  # repo root (package.json, lockfile, tsconfig, .dockerignore) and this
  # workflow run both; a manual run always runs both.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed parts
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared: &shared
              - '*'
              - '.github/workflows/ci.yml'
            api:
              - *shared
              - 'api/**'
            ui:
              - *shared
              - 'ui/**'

  operation_api-ci:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Set environment variables
        run: |
          echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build operation_api
        run: pnpm --filter operation_api build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (multi-platform)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            erxes/erxes-next-operation_api:latest
            erxes/erxes-next-operation_api:${{ env.DATE }}-${{ env.SHORT_SHA }}

  operation_ui-ci:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build operation UI
        run: pnpm exec nx build operation_ui

      - name: Sync to Cloudflare R2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws s3 sync dist/ui s3://erxes-next/latest/operation_ui/ \
            --endpoint-url https://7c8392aff8ac4518aa06dfa4b6337ef2.r2.cloudflarestorage.com
          aws s3 cp dist/ui/remoteEntry.js s3://erxes-next/latest/operation_ui/remoteEntry.js \
            --cache-control "no-cache" --content-type "application/javascript" \
            --endpoint-url https://7c8392aff8ac4518aa06dfa4b6337ef2.r2.cloudflarestorage.com
